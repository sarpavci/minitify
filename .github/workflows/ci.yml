name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and player build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No dependencies to install — the project is Node built-ins only.
      - name: Unit tests
        run: node --test

      - name: Build the WKWebView player
        run: sh player/build.sh

      - name: Confirm the binary runs headless-safe
        run: test -x player/wkplayer

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Relative links resolve
        run: python3 tools/check-links.py

      # The mark is generated, so a hand-edited SVG would drift silently
      # away from the geometry documented in docs/design.md.
      - name: The committed mark matches its generator
        run: |
          python3 tools/make-mark.py
          git diff --exit-code -- .github/assets
